name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is picked up from `packageManager` in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm eslint .

      - name: Prettier
        run: pnpm prettier --check .

      # --- apps/web ---
      - name: Generate Prisma client
        run: pnpm --filter @analyzer-testbed/web db:generate

      - name: Type-check apps/web
        run: pnpm --filter @analyzer-testbed/web tsc

      - name: Run graphql-cli validate (web project)
        run: pnpm graphql-cli validate --project web

      - name: Run apps/web tests
        run: pnpm --filter @analyzer-testbed/web test
        env:
          DATABASE_URL: file:./prisma/test.db
