name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is picked up from `packageManager` in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: ESLint
        run: pnpm eslint .

      - name: Prettier
        run: pnpm prettier --check .

      # --- apps/web ---
      - name: Generate Prisma client
        run: pnpm --filter @analyzer-testbed/web db:generate

      - name: Type-check apps/web
        run: pnpm --filter @analyzer-testbed/web tsc

      - name: Install GraphQL Analyzer CLI
        env:
          GRAPHQL_CLI_VERSION: v0.2.3
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/trevor-scheer/graphql-analyzer/releases/download/graphql-analyzer-cli/${GRAPHQL_CLI_VERSION}/graphql-cli-x86_64-unknown-linux-gnu.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/graphql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run graphql validate (web project)
        run: graphql validate --project web

      - name: Run apps/web tests
        run: pnpm --filter @analyzer-testbed/web test
        env:
          DATABASE_URL: file:./prisma/test.db

      - name: Install Playwright browsers
        run: pnpm --filter @analyzer-testbed/web exec playwright install chromium --with-deps

      - name: Run Prisma migrations against dev DB
        run: pnpm --filter @analyzer-testbed/web exec prisma migrate deploy
        env:
          DATABASE_URL: file:./dev.db

      - name: Fetch Pokémon seed data from PokeAPI
        run: pnpm --filter @analyzer-testbed/web db:seed:fetch

      - name: Seed database
        run: pnpm --filter @analyzer-testbed/web db:seed
        env:
          DATABASE_URL: file:./dev.db

      - name: Run Playwright E2E tests
        run: pnpm --filter @analyzer-testbed/web exec playwright test
        env:
          CI: true
          DATABASE_URL: file:./dev.db

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  typecheck-examples:
    name: Typecheck examples
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck relay-app (after relay-compiler)
        run: |
          pnpm --filter @analyzer-testbed/example-relay relay
          pnpm --filter @analyzer-testbed/example-relay typecheck

      - name: Typecheck svelte-app
        run: pnpm --filter @analyzer-testbed/example-svelte typecheck

      - name: Typecheck vue-app
        run: pnpm --filter @analyzer-testbed/example-vue typecheck

      - name: Typecheck astro-app
        run: pnpm --filter @analyzer-testbed/example-astro typecheck

      - name: Typecheck remote-schema
        run: pnpm --filter @analyzer-testbed/example-remote-schema typecheck

      - name: Typecheck multi-project
        run: pnpm --filter @analyzer-testbed/example-multi-project typecheck

  build-examples:
    name: Build examples
    runs-on: ubuntu-latest
    needs: typecheck-examples

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build relay-app
        run: |
          pnpm --filter @analyzer-testbed/example-relay relay
          pnpm --filter @analyzer-testbed/example-relay build

      - name: Build svelte-app
        run: pnpm --filter @analyzer-testbed/example-svelte build

      - name: Build vue-app
        run: pnpm --filter @analyzer-testbed/example-vue build

      - name: Build astro-app
        run: pnpm --filter @analyzer-testbed/example-astro build

  test-examples:
    name: Test examples
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Relay artifact smoke tests
        run: |
          pnpm --filter @analyzer-testbed/example-relay relay
          pnpm --filter @analyzer-testbed/example-relay test

      - name: Multi-project validation script
        run: pnpm --filter @analyzer-testbed/example-multi-project test

  expect-failure:
    name: Fixtures report errors (expect non-zero)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install GraphQL Analyzer CLI
        env:
          GRAPHQL_CLI_VERSION: v0.2.3
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/trevor-scheer/graphql-analyzer/releases/download/graphql-analyzer-cli/${GRAPHQL_CLI_VERSION}/graphql-cli-x86_64-unknown-linux-gnu.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/graphql"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fixtures must report errors
        # `graphql validate` v0.2.3 always exits 0 even when errors are found
        # (tracked: trevor-scheer/graphql-analyzer#1040). Workaround: parse
        # `--format=json` output and assert `stats.total_errors > 0`.
        run: |
          assert_errors() {
            local project="$1"
            local errors
            errors=$(graphql validate --format=json --project "$project" \
              | jq -r '.stats.total_errors // 0')
            if [ "${errors:-0}" -eq 0 ]; then
              echo "ERROR: $project reported 0 errors — expected at least 1"
              exit 1
            fi
            echo "OK: $project reported $errors error(s)"
          }
          assert_errors fixture-missing-fragment
          assert_errors fixture-unknown-directive
          # deprecated-field-usage is a warning, not an error — skip the
          # numeric assertion. Just exercise the command for smoke coverage.
          graphql validate --project fixture-deprecated-field-usage > /dev/null
          assert_errors fixture-selection-type-mismatch

      - name: Schema-cycle fixture must not hang or crash
        timeout-minutes: 1
        run: graphql validate --project fixture-schema-cycle || true
