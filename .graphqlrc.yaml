# Root graphql-config — one entry per workspace.
# multi-project has its own .graphqlrc.yaml and is NOT listed here.
projects:
  web:
    schema: "apps/web/graphql/*.graphql"
    documents:
      - "apps/web/app/**/*.{ts,tsx}"
      - "apps/web/graphql/fragments/*.ts"
      - "apps/web/graphql/fragments/*.graphql"
      - "apps/web/graphql/operations/**/*.graphql"
      - "!apps/web/graphql/generated/**"
    extensions:
      lint:
        rules:
          # Deprecation rules — captureRate is @deprecated, so this triggers
          - rule: no-deprecated
            severity: warning
          # Naming conventions
          - rule: naming-convention
            severity: error
            config:
              FieldDefinition: camelCase
              TypeDefinition: PascalCase
              EnumValueDefinition: SCREAMING_SNAKE_CASE

  relay:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/relay-app/src/**/*.{ts,tsx}"
    extensions:
      graphqlAnalyzer:
        lint:
          extends: recommended

  svelte:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/svelte-app/src/**/*.{ts,svelte}"
    extensions:
      graphqlAnalyzer:
        lint:
          extends: recommended

  vue:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/vue-app/src/**/*.{ts,vue}"
    extensions:
      graphqlAnalyzer:
        lint:
          extends: recommended

  astro:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/astro-app/src/**/*.{ts,tsx,astro}"
    extensions:
      graphqlAnalyzer:
        lint:
          extends: recommended

  remote-schema:
    schema: "https://countries.trevorblades.com"
    documents: "examples/remote-schema/src/**/*.ts"
    extensions:
      graphqlAnalyzer:
        lint:
          extends: recommended
