# Root graphql-config — one entry per workspace.
# multi-project has its own .graphqlrc.yaml and is NOT listed here.
projects:
  web:
    schema: "apps/web/graphql/*.graphql"
    documents:
      - "apps/web/app/**/*.{ts,tsx}"
      - "apps/web/graphql/fragments/*.ts"
      - "apps/web/graphql/fragments/*.graphql"
      - "apps/web/graphql/operations/**/*.graphql"
      - "!apps/web/graphql/generated/**"
    extensions:
      graphql-analyzer:
        lint:
          rules:
            # Deprecation rules — captureRate is @deprecated, so this triggers
            noDeprecated: warn
            # Naming conventions
            namingConvention:
              severity: error
              options:
                FieldDefinition: camelCase
                TypeDefinition: PascalCase
                EnumValueDefinition: SCREAMING_SNAKE_CASE

  relay:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/relay-app/src/**/*.{ts,tsx}"
    extensions:
      graphql-analyzer:
        lint:
          extends: recommended

  svelte:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/svelte-app/src/**/*.{ts,svelte}"
    extensions:
      graphql-analyzer:
        lint:
          extends: recommended

  vue:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/vue-app/src/**/*.{ts,vue}"
    extensions:
      graphql-analyzer:
        lint:
          extends: recommended

  astro:
    schema: "apps/web/graphql/*.graphql"
    documents: "examples/astro-app/src/**/*.{ts,tsx,astro}"
    extensions:
      graphql-analyzer:
        lint:
          extends: recommended

  remote-schema:
    schema: "https://countries.trevorblades.com"
    documents: "examples/remote-schema/src/**/*.ts"
    extensions:
      graphql-analyzer:
        lint:
          extends: recommended

  fixture-missing-fragment:
    schema: fixtures/intentional-errors/missing-fragment/schema.graphql
    documents: fixtures/intentional-errors/missing-fragment/operations.graphql

  fixture-unknown-directive:
    schema: fixtures/intentional-errors/unknown-directive/schema.graphql
    documents: fixtures/intentional-errors/unknown-directive/operations.graphql

  fixture-deprecated-field-usage:
    schema: fixtures/intentional-errors/deprecated-field-usage/schema.graphql
    documents: fixtures/intentional-errors/deprecated-field-usage/operations.graphql
    extensions:
      graphql-analyzer:
        lint:
          rules:
            noDeprecated: error

  fixture-selection-type-mismatch:
    schema: fixtures/intentional-errors/selection-type-mismatch/schema.graphql
    documents: fixtures/intentional-errors/selection-type-mismatch/operations.graphql

  fixture-schema-cycle:
    schema: fixtures/intentional-errors/schema-cycle/schema.graphql
